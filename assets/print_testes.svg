<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760">
  <rect width="820" height="760" rx="10" fill="#1e1e2e"/>
  <rect width="820" height="36" rx="10" fill="#181825"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="410" y="23" text-anchor="middle" fill="#cdd6f4" font-family="Consolas, monospace" font-size="13">Terminal — java -cp bin calculadora.TesteCalculadora</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#cdd6f4">
    <text x="20" y="62" fill="#89b4fa">PS C:\projeto_calculadora&gt; java -cp bin calculadora.TesteCalculadora</text>
    <text x="20" y="84" fill="#f9e2af">==================================================</text>
    <text x="20" y="102" fill="#f9e2af">        EXECUCAO DE TESTES - FINANCAPP            </text>
    <text x="20" y="120" fill="#f9e2af">==================================================</text>

    <text x="20" y="146" fill="#89dceb">&gt;&gt;&gt; Teste de Soma</text>
    <text x="20" y="164">Entradas utilizadas : a = 2, b = 3, op = "+" | Esperado: 5 | Obtido: 5</text>
    <text x="20" y="182" fill="#a6e3a1">Resultado = 5  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="208" fill="#89dceb">&gt;&gt;&gt; Teste de Soma (valores maiores)</text>
    <text x="20" y="226">Entradas utilizadas : a = 150, b = 250, op = "+" | Esperado: 400 | Obtido: 400</text>
    <text x="20" y="244" fill="#a6e3a1">Resultado = 400  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="270" fill="#89dceb">&gt;&gt;&gt; Teste de Subtracao</text>
    <text x="20" y="288">Entradas utilizadas : a = 10, b = 4, op = "-" | Esperado: 6 | Obtido: 6</text>
    <text x="20" y="306" fill="#a6e3a1">Resultado = 6  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="332" fill="#89dceb">&gt;&gt;&gt; Teste de Subtracao (resultado negativo)</text>
    <text x="20" y="350">Entradas utilizadas : a = 5, b = 12, op = "-" | Esperado: -7 | Obtido: -7</text>
    <text x="20" y="368" fill="#a6e3a1">Resultado = -7  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="394" fill="#89dceb">&gt;&gt;&gt; Teste de Multiplicacao</text>
    <text x="20" y="412">Entradas utilizadas : a = 3, b = 5, op = "*" | Esperado: 15 | Obtido: 15</text>
    <text x="20" y="430" fill="#a6e3a1">Resultado = 15  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="456" fill="#89dceb">&gt;&gt;&gt; Teste de Multiplicacao por Zero</text>
    <text x="20" y="474">Entradas utilizadas : a = 25, b = 0, op = "*" | Esperado: 0 | Obtido: 0</text>
    <text x="20" y="492" fill="#a6e3a1">Resultado = 0  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="518" fill="#89dceb">&gt;&gt;&gt; Teste de Divisao Exata / Divisao de Despesas</text>
    <text x="20" y="536">Entradas utilizadas : a = 8, b = 2, op = "/" (Obtido: 4) | a = 100, b = 4, op = "/" (Obtido: 25)</text>
    <text x="20" y="554" fill="#a6e3a1">Status dos Testes : [PASSOU]</text>

    <text x="20" y="580" fill="#89dceb">&gt;&gt;&gt; Teste de Divisao por Zero</text>
    <text x="20" y="598">Entradas utilizadas : a = 8, b = 0, op = "/" | Esperado: 0 | Obtido: 0</text>
    <text x="20" y="616" fill="#fab387">Erro: divisao por zero nao e permitida. | Resultado = 0  --&gt;  [PASSOU]</text>

    <text x="20" y="642" fill="#89dceb">&gt;&gt;&gt; Teste de Operacoes Invalidas ('x' e '%')</text>
    <text x="20" y="660">Entradas utilizadas : a = 5, b = 5, op = "x" | a = 10, b = 2, op = "%"</text>
    <text x="20" y="678" fill="#fab387">Operacao invalida: x / % | Resultado = 0  --&gt;  Status do Teste : [PASSOU]</text>

    <text x="20" y="710" fill="#f9e2af">==================================================</text>
    <text x="20" y="728" fill="#a6e3a1">      FIM DA EXECUCAO DOS TESTES (11/11 PASSARAM) </text>
    <text x="20" y="746" fill="#f9e2af">==================================================</text>
  </g>
</svg>
