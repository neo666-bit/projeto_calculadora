<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620">
  <rect width="760" height="620" rx="6" fill="#0c0c0c" stroke="#333333" stroke-width="1"/>
  <rect width="760" height="30" rx="6" fill="#1f1f1f"/>
  <text x="15" y="20" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">Prompt de Comando - java -cp bin calculadora.TesteCalculadora</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#cccccc">
    <text x="16" y="55">C:\projeto_calculadora&gt;java -cp bin calculadora.TesteCalculadora</text>
    <text x="16" y="78">--- Testes da Calculadora ---</text>

    <text x="16" y="108">Teste Soma: entradas (2, 3, '+')</text>
    <text x="16" y="126">Resultado esperado: 5</text>
    <text x="16" y="144">Resultado = 5</text>
    <text x="16" y="162">Resultado obtido: 5</text>

    <text x="16" y="192">Teste Subtracao: entradas (10, 4, '-')</text>
    <text x="16" y="210">Resultado esperado: 6</text>
    <text x="16" y="228">Resultado = 6</text>
    <text x="16" y="246">Resultado obtido: 6</text>

    <text x="16" y="276">Teste Multiplicacao: entradas (3, 5, '*')</text>
    <text x="16" y="294">Resultado esperado: 15</text>
    <text x="16" y="312">Resultado = 15</text>
    <text x="16" y="330">Resultado obtido: 15</text>

    <text x="16" y="360">Teste Divisao: entradas (8, 2, '/')</text>
    <text x="16" y="378">Resultado esperado: 4</text>
    <text x="16" y="396">Resultado = 4</text>
    <text x="16" y="414">Resultado obtido: 4</text>

    <text x="16" y="444">Teste Divisao por Zero: entradas (8, 0, '/')</text>
    <text x="16" y="462">Resultado esperado: 0 (mensagem de erro)</text>
    <text x="16" y="480">Erro: divisao por zero nao permitida</text>
    <text x="16" y="498">Resultado = 0</text>
    <text x="16" y="516">Resultado obtido: 0</text>

    <text x="16" y="546">Teste Operacao Invalida: entradas (5, 5, 'x')</text>
    <text x="16" y="564">Resultado esperado: 0 (mensagem de operacao invalida)</text>
    <text x="16" y="582">Erro: operacao invalida</text>
    <text x="16" y="600">Resultado obtido: 0</text>
  </g>
</svg>
